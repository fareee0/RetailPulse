# RetailPulse Configuration File
project:
  name: "RetailPulse – AI-Powered Customer Analytics & Demand Forecasting Platform"
  version: "1.0.0"
  random_seed: 42

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  models_dir: "models"
  logs_dir: "logs"
  reports_dir: "reports"

data:
  uci_url: "https://archive.ics.uci.edu/static/public/502/online+retail+ii.zip"
  kaggle_dataset: "mashlyn/online-retail-ii-uci"
  raw_filename: "online_retail_II.xlsx"
  cleaned_parquet: "data/processed/online_retail_cleaned.parquet"
  cleaned_csv: "data/processed/online_retail_cleaned.csv"
  sheets:
    - "Year 2009-2010"
    - "Year 2010-2011"
  columns:
    invoice: "Invoice"
    stock_code: "StockCode"
    description: "Description"
    quantity: "Quantity"
    invoice_date: "InvoiceDate"
    price: "Price"
    customer_id: "CustomerID"
    country: "Country"
    total_price: "TotalPrice"

cleaning:
  drop_null_customers: true
  filter_cancellations: true
  min_quantity: 1
  min_price: 0.0001
  drop_duplicates: true

features:
  churn_cutoff_days: 90
  rfm_quantiles: 5
  forecast_horizon_days: 90
  lag_windows: [7, 14, 28]
  rolling_windows: [7, 14, 28]

forecasting:
  train_test_split_days: 90
  prophet:
    yearly_seasonality: true
    weekly_seasonality: true
    daily_seasonality: false
    holidays_country: "UK"
    changepoint_prior_scale: 0.05
    seasonality_prior_scale: 10.0
  lstm:
    sequence_length: 28
    hidden_units: 64
    dropout: 0.2
    epochs: 50
    batch_size: 32
    learning_rate: 0.001
    patience: 10
  hybrid:
    prophet_weight: 0.5
    lstm_weight: 0.5

churn:
  cutoff_days: 90
  models:
    - "LogisticRegression"
    - "RandomForest"
    - "GradientBoosting"
  test_size: 0.2
  class_weight: "balanced"
  n_estimators: 200
  max_depth: 8

inventory:
  service_level: 0.95
  z_score: 1.645
  lead_time_days: 7
  holding_cost_pct: 0.20
  ordering_cost: 50.0
  top_n_skus: 50

monitoring:
  drift_psi_threshold: 0.25
  drift_ks_alpha: 0.05
  performance_degradation_threshold: 0.10
  reference_window_days: 180
  current_window_days: 90

mlops:
  mlflow_tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "RetailPulse_Analytics"
  drift_psi_threshold: 0.25
  drift_ks_alpha: 0.05

api:
  host: "0.0.0.0"
  port: 8000
