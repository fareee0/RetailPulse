name: RetailPulse CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgomp1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov
          pip install -r requirements.txt
          pip install prophet fastapi uvicorn httpx pyyaml optuna shap

      - name: Lint Code with Ruff
        run: |
          # Stop build if there are Python syntax errors or undefined names
          ruff check src/ tests/ --select=E9,F63,F7,F82 --show-source
          # Exit-zero treats all warnings as non-fatal
          ruff check src/ tests/ --exit-zero

      - name: Run Pytest Suite with Coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report-python-${{ matrix.python-version }}
          path: coverage.xml

  docker-build:
    name: Build & Verify Production Container Image
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: retailpulse:ci-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
